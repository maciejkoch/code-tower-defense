name: Check MVP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@12.0.2
      - run: npm ci
      - name: Types, tests and production build
        run: npm run check
      - name: Strategy smoke matches
        run: npm run balance -- --profile=active --quick --verify --limit=300
      - name: GitHub Pages build and asset paths
        run: npm run build:pages
