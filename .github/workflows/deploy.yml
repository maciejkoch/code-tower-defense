name: Deploy GitHub Pages manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@12.0.2
      - run: npm ci
      - name: Types, tests and production build
        run: npm run check
      - name: Strategy smoke matches
        run: npm run balance -- --profile=active --quick --verify --limit=300
      - uses: actions/configure-pages@v5
      - name: GitHub Pages build and asset paths
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/code-tower-defense/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
